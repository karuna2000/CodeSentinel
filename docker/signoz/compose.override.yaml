# Local override (NOT generated by Foundry — do not put in casting.yaml).
#
# Why: the stock entrypoint enrolls the collector in the query-service's
# opamp remote management, which overwrites the local receivers/exporters
# with `nop` (OTLP :4317/:4318 go deaf). For local dev we want the static
# ingester.yaml to win, so drop the --manager-config flag. Re-apply after
# any `foundryctl forge` regeneration (pours/ is generated).
services:
  ingester:
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --copy-path=/var/tmp/collector-config.yaml
    entrypoint:
      - /bin/sh
