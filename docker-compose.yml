# Local services for CodeSentinel development.
#
# Usage:
#   docker compose up -d db     # start Postgres (stable port 5433)
#   npm run db:status           # confirm migrations are applied
#   docker compose down         # stop (volume `pgdata` is kept)
#
# What's here — and what isn't — is deliberate:
# - Postgres 16 + pgvector is the only required local service (DATABASE_URL).
# - Redis is intentionally absent: rate limiting uses @upstash/redis (REST
#   protocol), which a stock redis container cannot serve. Redis arrives with
#   the Phase C answer-cache work, together with a RESP client.
# - Qdrant / Neo4j / Inngest / Langfuse are not used by this codebase
#   (pgvector + in-DB graph + cron worker cover those roles) and are
#   excluded so local dev pays no RAM for them.
# - SaaS dependencies (GitHub OAuth/App, NVIDIA NIM) stay in .env.local.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: codesentinel-postgres-compose
    ports:
      # Fixed host port (5433 avoids clashing with host-native Postgres on
      # 5432). DATABASE_URL in .env.local points here — stable across restarts.
      - '5433:5432'
    environment:
      POSTGRES_DB: postgres
      # Dev-only default; override via environment, never commit a real secret.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codesentinel-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
